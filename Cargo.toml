[workspace]
resolver = "3"
members = [
    "lifecore-app",
    "lifecore-cli",
    "lifecore-dag-check",
    "lifecore-server",
    "lifecore-typecheck"
]

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
let_underscore_must_use = "warn"
new_without_default = "allow"

[profile.dev]
panic = "abort"

[package]
name = "lifecore"
version = "0.0.1"
description = "A graph personal database"
edition.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
jiff = { version = "0.2.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
semver = { version = "1.0", features = ["serde"] }
