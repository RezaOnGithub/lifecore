[workspace]
resolver = "3"
members = [
    # "lifecore-cli",
    # "lifecore-kman",
    # "lifecore-proc-macro",
    # "lifecore-prod",
    # "lifecore-test",
    "lifecore-typecheck"
]

[workspace.package]
edition = "2024"
# TODO what is this
# include = [
#   "build.rs",
#   "src/**/*",
#   "Cargo.toml",
#   "LICENSE*",
#   "README.md",
#   "examples/**/*"
# ]

[workspace.lints.rust]
unused_must_use = "warn"

[workspace.lints.clippy]
let_underscore_must_use = "warn"
new_without_default = "allow"

[profile.dev]
panic = "abort"

# Root Package: Base LifeCore Library
[package]
name = "lifecore"
version = "0.0.1"
description = "A graph personal database"
lints = { workspace = true }
edition.workspace = true

# TODO what are these
# repository.workspace = true
# license.workspace = true
# edition.workspace = true
# rust-version.workspace = true
# include.workspace = true

[features]
default = []

[dependencies]
arrayvec = { version = "0.7.6", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
itertools = "0.15.0"
indexmap = { version = "2.14.0", features = ["serde"] }
jiff = { version = "0.2.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
whoami = "2.1.2"
thiserror = "2.0.18"
log = "0.4.33"
regex = "1.13.1"
uuid = "1.24.0" # this is required for exactly one function

[dev-dependencies]
env_logger = "0.11.11"
