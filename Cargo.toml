[package]
name = "lc-sketch"
version = "0.1.0"
edition = "2024"

[lib]
name = "lifecore"

[[bin]]
name = "lc1"

[dependencies]
anyhow = "1.0.102"
arrayvec = { version = "0.7.6", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
itertools = "0.15.0"
jiff = { version = "0.2.28", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["jiff"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28.0", features = ["derive"] }
whoami = "2.1.2"
