[package]
name = "lifecore-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
jiff = "0.2.28"
lifecore = { path = "../" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
thiserror = "2.0.18"
toml = "1.1"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

# `cargo bench` runs the benchmark below, not the unit tests in bench mode.
[lib]
bench = false

[dev-dependencies]
lifecore-dag-check = { path = "../lifecore-dag-check" }
lifecore-reconnect = { path = "../lifecore-reconnect" }
lifecore-typecheck = { path = "../lifecore-typecheck" }
lifecore-workload = { path = "../lifecore-workload" }

# Timed with `Instant` rather than the nightly `#[bench]` harness
# (PERFORMANCE §1).
[[bench]]
name = "checking"
harness = false

[lints]
workspace = true
