[package]
name = "lifecore-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "lifecore"
path = "src/main.rs"

[dependencies]
lifecore = { path = "../" }
lifecore-app = { path = "../lifecore-app" }
lifecore-dag-check = { path = "../lifecore-dag-check" }
lifecore-typecheck = { path = "../lifecore-typecheck" }
clap = { version = "4.6", features = ["derive"] }
serde = "1.0.228"
serde_json = "1.0.150"

[lints]
workspace = true
