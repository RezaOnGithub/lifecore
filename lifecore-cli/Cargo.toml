[package]
name = "lifecore-cli"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
anyhow = { version = "1.0.103", optional = true }
clap = { version = "4.6.1", features = ["derive"], optional = true }
itertools = "0.15.0"
lifecore = { path = "../lifecore" }
lifecore-typecheck = { path = "../lifecore-typecheck" }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[lints]
workspace = true
