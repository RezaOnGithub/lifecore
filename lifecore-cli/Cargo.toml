[package]
name = "lifecore-cli"
version = "0.1.0"
edition.workspace = true
default-run = "lifecore-cli"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
lifecore = { path = ".." }
lifecore-dag-check = { path = "../lifecore-dag-check" }
lifecore-typecheck = { path = "../lifecore-typecheck" }
log = "0.4.33"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha3 = "0.10.8"
tempfile = "3.24.0"
thiserror = "2.0.18"
toml = "0.9.8"
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[lints]
workspace = true
