<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifeCore</title>
    <style>
      :root {
        font-size: 14px;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #1b1b1b;
      }
      code,
      pre {
        font-family: ui-monospace, monospace;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0 0 0.5rem;
      }
      h3 {
        font-size: 1rem;
        margin: 1rem 0 0.3rem;
      }
      h4 {
        font-size: 0.85rem;
        color: #666;
        margin: 0.6rem 0 0.2rem;
      }
      /* The shell fills the viewport; the top bar and sidebar stay put and
         only the main pane and the sidebar scroll. minmax(0, 1fr) lets the
         row shrink below its content so overflow: auto takes effect. */
      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-columns: 15rem 1fr;
        height: 100vh;
      }
      header.top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.35rem 0.75rem;
        border-bottom: 1px solid #c8c8c8;
        background: #f4f4f4;
        flex-wrap: wrap;
      }
      header.top .spacer {
        flex: 1;
      }
      nav.side {
        border-right: 1px solid #c8c8c8;
        padding: 0.5rem 0.75rem;
        overflow: auto;
      }
      nav.side h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #666;
        margin: 0.75rem 0 0.25rem;
      }
      nav.side .hint {
        text-transform: none;
        font-weight: normal;
        font-style: italic;
      }
      main {
        padding: 0.75rem 1rem;
        overflow: auto;
        min-width: 0;
      }
      main.full {
        grid-column: 1 / -1;
      }
      .types {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .types li {
        padding: 0.1rem 0.25rem;
        white-space: nowrap;
      }
      .types li.active {
        background: #e4ecf7;
      }
      .counts {
        color: #666;
        font-size: 0.85rem;
      }
      .db-id {
        display: inline-block;
        max-width: 8ch;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
      }
      /* Separate borders: with collapsed ones Firefox drops the borders of a
         sticky header once it scrolls. Each cell draws its right and bottom
         edge, the first column its left edge, and the first row its top
         edge, so the grid still reads as continuous. */
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      th,
      td {
        border-right: 1px solid #c8c8c8;
        border-bottom: 1px solid #c8c8c8;
        padding: 0.15rem 0.4rem;
        text-align: left;
        vertical-align: top;
        font-size: 0.9rem;
      }
      th:first-child,
      td:first-child {
        border-left: 1px solid #c8c8c8;
      }
      thead th {
        border-top: 1px solid #c8c8c8;
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f4f4f4;
        white-space: nowrap;
      }
      tr.historical td {
        color: #666;
        background: #fafafa;
      }
      table > tbody:first-child > tr:first-child > th,
      table > tbody:first-child > tr:first-child > td {
        border-top: 1px solid #c8c8c8;
      }
      .cell {
        max-width: 24rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .col-mandatory {
        font-weight: 700;
      }
      .col-deprecated {
        text-decoration: line-through;
      }
      .col-undeclared {
        font-style: italic;
        color: #a60;
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        color: #0645ad;
        text-decoration: underline;
        cursor: pointer;
        font: inherit;
      }
      button.sort {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pos {
        color: #555;
        font-size: 0.85em;
      }
      .muted {
        color: #666;
      }
      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        flex-wrap: wrap;
        margin: 0.3rem 0;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        line-height: 1.3;
        padding: 0 0.3rem;
        border-radius: 3px;
        border: 1px solid #999;
        background: #eee;
        vertical-align: middle;
        white-space: nowrap;
      }
      .badge.current {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .badge.historical {
        color: #666;
      }
      .badge.warn {
        border-color: #c80;
        background: #fff3dc;
      }
      .badge.asof {
        border-color: #06c;
        background: #e6f0ff;
        font-weight: 600;
      }
      .badge.status-mandatory {
        border-color: #333;
      }
      .badge.status-encouraged {
        border-color: #27a;
        background: #e8f2fb;
      }
      .badge.status-deprecated {
        border-color: #a33;
        background: #fbeaea;
      }
      .chips {
        display: flex;
        gap: 0.3rem;
        list-style: none;
        padding: 0;
        margin: 0.3rem 0;
        flex-wrap: wrap;
      }
      .chips li {
        border: 1px solid #aaa;
        border-radius: 1rem;
        padding: 0 0.5rem;
        background: #f4f4f4;
      }
      .chips li.muted {
        border: none;
        background: none;
      }
      fieldset {
        border: 1px solid #c8c8c8;
        margin: 0.4rem 0;
        padding: 0.3rem 0.6rem;
      }
      legend {
        font-size: 0.85rem;
        color: #666;
      }
      .toggle button {
        border: 1px solid #999;
        background: #f4f4f4;
        padding: 0.1rem 0.6rem;
        cursor: pointer;
      }
      .toggle button.on {
        background: #1b1b1b;
        color: #fff;
      }
      .lineage,
      .thread {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .lineage li,
      .thread li {
        padding: 0.15rem 0.4rem;
        border-left: 4px solid transparent;
      }
      .lineage li.current {
        font-weight: 600;
      }
      .lineage li.inspected {
        background: #eef;
      }
      .thread li.repeat,
      .thread li.cycle {
        color: #666;
      }
      .thread li.hl {
        background: #fff7c2;
      }
      .stripe-mark {
        display: inline-block;
        min-width: 0.9rem;
        font-size: 0.7rem;
        color: #666;
      }
      .stripe-0 {
        border-left-color: #e6194b;
      }
      .stripe-1 {
        border-left-color: #3cb44b;
      }
      .stripe-2 {
        border-left-color: #4363d8;
      }
      .stripe-3 {
        border-left-color: #f58231;
      }
      .stripe-4 {
        border-left-color: #911eb4;
      }
      .stripe-5 {
        border-left-color: #42d4f4;
      }
      .stripe-6 {
        border-left-color: #f032e6;
      }
      .stripe-7 {
        border-left-color: #9a6324;
      }
      .permissions {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 0.75rem;
        margin: 0.5rem 0;
      }
      .permissions dt {
        color: #666;
      }
      .permissions dd {
        margin: 0;
      }
      pre.raw {
        background: #f4f4f4;
        padding: 0.5rem;
        overflow: auto;
      }
      .error {
        border: 1px solid #b00020;
        background: #fff4f4;
        padding: 0.5rem 1rem;
      }
      .error.compact {
        padding: 0.3rem 0.5rem;
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      .error.compact h2 {
        font-size: 0.9rem;
        text-transform: none;
        color: inherit;
        margin: 0 0 0.25rem;
      }
      .error.compact p {
        margin: 0;
      }
      /* navigation */
      /* Relationship cells wrap, unlike payload cells, so that a few
         neighbour labels fit side by side. */
      /* Rows stay one line, so a long table scans; it scrolls sideways
         instead. An expanded neighbour list wraps. */
      td.label-cell,
      td.rel-cell,
      td.via-cell {
        white-space: nowrap;
      }
      .neighbour-item {
        white-space: nowrap;
      }
      .neighbours.all {
        display: inline-block;
        max-width: 30rem;
        white-space: normal;
      }
      .hop {
        display: inline-block;
        min-width: 0.9rem;
        font-size: 0.7rem;
        text-align: center;
        color: #555;
        background: #eee;
        border-radius: 0.5rem;
      }
      button.link.neighbour.superseded {
        color: #666;
      }
      button.link.neighbour.historical {
        color: #777;
        font-style: italic;
        text-decoration-style: dotted;
      }
      button.link.more,
      button.link.small {
        font-size: 0.8rem;
        color: #555;
      }
      .outline,
      .rel-items {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .rel-items {
        margin-left: 1.25rem;
      }
      .outline-empty {
        font-size: 0.85rem;
        margin: 0;
      }
      /* A neighbour's own relationships hang under it, one step in. */
      .rel-item > .outline,
      .rel-item > .outline-empty,
      .rel-item > .error {
        margin: 0 0 0.2rem 0.6rem;
        padding-left: 0.6rem;
        border-left: 1px dotted #aaa;
      }
      .rel-head,
      .rel-row {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0 0.4rem;
        padding: 0.05rem 0.2rem;
      }
      .rel-row:hover,
      .rel-head:hover {
        background: #f1f5fb;
      }
      button.rel-toggle {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        cursor: pointer;
        display: inline-flex;
        gap: 0.35rem;
        align-items: baseline;
      }
      .rel-name {
        font-weight: 600;
      }
      .twisty {
        display: inline-block;
        width: 1rem;
        text-align: center;
        color: #555;
      }
      button.twisty {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        cursor: pointer;
      }
      button.twisty:hover {
        color: #06c;
      }
      .rel-row .ty,
      .rel-row .edge-ref {
        font-size: 0.8rem;
        color: #777;
      }
      .rel-item.historical > .rel-row {
        color: #666;
      }
      .on-path {
        font-style: italic;
        font-size: 0.8rem;
      }
      .via-type {
        font-size: 0.75rem;
        color: #666;
        margin-right: 0.35rem;
      }
      button.link.via-edge {
        white-space: nowrap;
        color: #333;
        text-decoration-style: dotted;
      }
      .row-actions {
        display: inline-flex;
        gap: 0.2rem;
        margin-left: 0.5rem;
        opacity: 0.55;
      }
      td.actions .row-actions {
        margin-left: 0;
      }
      tr:hover .row-actions {
        opacity: 1;
      }
      /* In a thread every row is a node, so its actions wait for the
         pointer. */
      .thread li .row-actions {
        visibility: hidden;
        opacity: 1;
      }
      .thread li:hover .row-actions,
      .thread li:focus-within .row-actions {
        visibility: visible;
      }
      td.actions {
        white-space: nowrap;
        width: 1%;
      }
      button.mini {
        font-size: 0.75rem;
        line-height: 1.2;
        padding: 0 0.3rem;
      }
      .graph-frame {
        border: 1px solid #c8c8c8;
        max-height: 70vh;
        overflow: auto;
        background: #fff;
      }
      .graph-sizer {
        overflow: hidden;
      }
      .graph-svg {
        width: max-content;
        transform-origin: 0 0;
      }
      .graph-svg svg {
        display: block;
      }
      pre.dot {
        max-height: 30vh;
        font-size: 0.8rem;
      }
      button.pin {
        background: none;
        border: none;
        padding: 0;
        font-size: 1.1rem;
        line-height: 1;
        color: #c80;
        cursor: pointer;
      }
      .places li {
        display: flex;
        align-items: baseline;
        gap: 0.3rem;
      }
      .places .place-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      .places .place-type {
        font-size: 0.75rem;
        color: #888;
        white-space: nowrap;
      }
      .places button.remove {
        margin-left: auto;
        color: #888;
        text-decoration: none;
      }
      .places li.beyond .place-label {
        color: #999;
      }
      .side-hint {
        font-size: 0.8rem;
        margin: 0.1rem 0.25rem;
      }
      .save-view {
        display: inline-flex;
        gap: 0.3rem;
        align-items: center;
      }
      /* editors */
      .editor .row > label {
        color: #666;
      }
      .editor input[aria-invalid="true"],
      .editor textarea[aria-invalid="true"] {
        border: 1px solid #b00020;
        background: #fff4f4;
      }
      .field-error {
        color: #b00020;
        font-size: 0.85rem;
      }
      .ref-chip {
        display: inline-block;
        border: 1px solid #aaa;
        border-radius: 1rem;
        padding: 0 0.5rem;
        background: #f4f4f4;
      }
      .intent {
        display: inline-flex;
        gap: 0.6rem;
        align-items: center;
        margin-left: 0.5rem;
      }
      .payload-editor .row h4 {
        margin: 0;
      }
      .fields-editor table.fields,
      .decls-editor table.fields {
        width: 100%;
      }
      table.fields td.value {
        width: 100%;
      }
      table.fields > tbody > tr.undeclared > th {
        font-style: italic;
        color: #a60;
      }
      table.fields > tbody > tr.group > th {
        background: #f4f4f4;
        color: #666;
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      /* Nested bodies indent under their field; their headers must not
         stick, or every level would pile up at the top while scrolling. */
      .fields-editor.nested,
      .decls-editor.nested {
        margin: 0.2rem 0 0.2rem 0.5rem;
        padding-left: 0.5rem;
        border-left: 2px solid #ddd;
      }
      .fields-editor.nested table.fields thead th,
      .decls-editor.nested table.fields thead th {
        position: static;
      }
      .list-editor .row {
        margin: 0.15rem 0;
      }
      .shape-builder {
        display: inline-flex;
        gap: 0.3rem;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .raw-editor textarea {
        font-family: ui-monospace, monospace;
        width: 100%;
        box-sizing: border-box;
      }
      .raw-editor {
        max-width: 60rem;
      }
      /* Text values grow a row per line; long lines wrap. */
      textarea.text-value {
        font: inherit;
        width: 100%;
        max-width: 40rem;
        box-sizing: border-box;
        resize: vertical;
        vertical-align: top;
      }
      .edit-note {
        color: #666;
        font-size: 0.85rem;
        font-style: italic;
        margin-left: 0.3rem;
      }
      .edit-hint {
        color: #8a5a00;
        font-size: 0.85rem;
        margin-left: 0.3rem;
      }
      .add-decl {
        margin-top: 0.3rem;
      }
      /* draft */
      /* A third column for the draft tray; main keeps minmax(0, 1fr) so it
         can shrink and scroll. A failed description spans the first two
         columns, so the tray stays. */
      .app {
        grid-template-columns: 15rem minmax(0, 1fr) auto;
      }
      .app > main.full {
        grid-column: 1 / span 2;
      }
      /* The tray is a column: a header that never scrolls away and the
         operations below it, which scroll on their own. */
      aside.tray {
        border-left: 1px solid #c8c8c8;
        background: #fbfbfb;
        width: 26rem;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
      }
      aside.tray.collapsed {
        width: auto;
        padding: 0.5rem 0.3rem;
        align-items: center;
        gap: 0.5rem;
      }
      aside.tray.collapsed .strip {
        writing-mode: vertical-rl;
        color: #666;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .tray-head {
        flex: none;
        max-height: 60%;
        overflow: auto;
        padding: 0.4rem 0.75rem;
        border-bottom: 1px solid #ddd;
      }
      .tray-head .row {
        margin: 0.25rem 0;
      }
      .tray-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0.3rem 0.75rem 0.75rem;
      }
      .tray-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #666;
        margin: 0.1rem 0;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .tray-spacer {
        flex: 1;
      }
      aside.tray h3 {
        font-size: 0.9rem;
        margin: 0.75rem 0 0.25rem;
      }
      .apply-note {
        font-size: 0.8rem;
      }
      .plan {
        font-size: 0.75rem;
        color: #666;
        overflow-wrap: anywhere;
        margin: 0.2rem 0;
      }
      button.confirm {
        border-color: #b00020;
        color: #b00020;
      }
      fieldset.frame {
        border: none;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .operations {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .operations li.op {
        padding: 0.1rem 0.3rem;
        border-bottom: 1px solid #eee;
        font-size: 0.85rem;
      }
      .operations li.op.selected {
        background: #eef4ff;
        box-shadow: inset 2px 0 0 #06c;
      }
      .operations li.op.invalid {
        background: #fff4f4;
        box-shadow: inset 2px 0 0 #b00020;
      }
      .op-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.2rem 0.4rem;
      }
      .op-line .op-name {
        font-weight: 600;
      }
      .op-line .op-type {
        color: #333;
      }
      .op-line .chip {
        font-size: 0.8rem;
        color: #555;
      }
      .pos.dim,
      .dim {
        opacity: 0.55;
      }
      .dim-note {
        font-size: 0.8rem;
        font-style: italic;
        margin: 0.1rem 0;
      }
      .op-warn {
        margin: 0.1rem 0 0.1rem 0.5rem;
        font-size: 0.8rem;
        color: #8a5a00;
      }
      .op-warn::before {
        content: "⚠ ";
      }
      .ref-unset {
        color: #b00020;
        font-weight: 600;
      }
      .kept-group {
        padding: 0.05rem 0.3rem 0.1rem 1.2rem;
        border-bottom: 1px solid #eee;
        font-size: 0.8rem;
      }
      .operations.nested li.op {
        border-bottom: none;
        padding-left: 0;
      }
      .badge.kind {
        text-transform: uppercase;
        font-size: 0.65rem;
      }
      .badge.kind-inconsistency,
      .badge.check-bad {
        border-color: #b00020;
        background: #fde8ea;
      }
      .badge.kind-warning,
      .badge.check-warn {
        border-color: #c80;
        background: #fff3dc;
      }
      .badge.kind-suggestion {
        border-color: #27a;
        background: #e8f2fb;
      }
      .badge.check-ok {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .badge.resolved {
        border-color: #2a7;
        font-style: italic;
      }
      .ref-issue button.link {
        color: #a60;
        text-decoration: underline wavy;
      }
      .findings {
        list-style: none;
        margin: 0.2rem 0;
        padding: 0;
        font-size: 0.85rem;
      }
      .findings li {
        padding: 0.15rem 0;
        border-top: 1px dotted #ddd;
      }
      .findings .chips {
        margin: 0.15rem 0 0;
        font-size: 0.8rem;
      }
      .banner {
        border: 1px solid #999;
        background: #f4f4f4;
        padding: 0.4rem 0.6rem;
        margin: 0.4rem 0;
        font-size: 0.9rem;
        border-radius: 3px;
        overflow-wrap: anywhere;
      }
      .banner .note {
        margin: 0.3rem 0;
      }
      .banner ul {
        margin: 0.2rem 0 0.2rem 1rem;
        padding: 0;
      }
      .banner.asof {
        border-color: #06c;
        background: #e6f0ff;
      }
      .banner.stale,
      .banner.busy {
        border-color: #c80;
        background: #fff3dc;
      }
      .banner.uncertain,
      .banner.problem {
        border-color: #b00020;
        background: #fff4f4;
      }
      .banner.uncertain {
        border-width: 2px;
      }
      .banner.applied {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .banner.picking {
        border-color: #27a;
        background: #e8f2fb;
      }
      .notices {
        list-style: none;
        margin: 0.3rem 0;
        padding: 0;
        font-size: 0.85rem;
      }
      .notices li {
        padding: 0.2rem 0.4rem;
        margin: 0.2rem 0;
        border-left: 3px solid #c80;
        background: #fffaf0;
      }
      .export-error {
        color: #b00020;
        font-size: 0.85rem;
        margin: 0.2rem 0;
      }
      aside.tray textarea.export {
        width: 100%;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      .importer textarea {
        width: 100%;
        max-width: 60rem;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
      }
      .reconnect-head {
        margin: 0.4rem 0 0.1rem;
      }
      .reconnect-list {
        list-style: none;
        margin: 0.1rem 0;
        padding: 0;
      }
      .reconnect-list li {
        padding: 0.1rem 0;
      }
      /* findings */
      button.link.disclosure {
        color: inherit;
        text-decoration: none;
        font-weight: inherit;
      }
      button.link.disclosure:hover {
        text-decoration: underline;
      }
      table.context {
        margin: 0.4rem 0;
      }
      .implementations {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .findings-filters {
        padding: 0.3rem 0;
        border-bottom: 1px solid #ddd;
      }
      .findings-filters .filter-gap {
        width: 0.8rem;
      }
      .finding-groups {
        list-style: none;
        margin: 0.3rem 0;
        padding: 0;
      }
      /* One line per finding where it fits: the observations take the
         room, the dismissal controls sit at the right end, and anything
         else (other ranges, the dismiss form, a failure) takes a line. */
      .finding-group {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 0.6rem;
        padding: 0.15rem 0.5rem;
        border-bottom: 1px solid #e4e4e4;
        border-left: 3px solid #ccc;
      }
      .finding-group > * {
        flex: 1 1 100%;
      }
      .finding-group > .findings {
        flex: 1 1 30rem;
      }
      .finding-group > .dismissal {
        flex: none;
        margin-left: auto;
      }
      .finding-group li.finding > .chips {
        display: inline-flex;
        margin: 0 0 0 0.3rem;
      }
      .finding-group.inconsistency {
        border-left-color: #b00020;
      }
      .finding-group.warning {
        border-left-color: #c80;
      }
      .finding-group.suggestion {
        border-left-color: #27a;
      }
      .finding-group.dismissed {
        background: #f8f8f8;
        color: #555;
      }
      .finding-group .findings {
        margin: 0;
        font-size: 0.9rem;
      }
      .finding-group .findings li.finding {
        border-top: none;
      }
      .finding-group .also {
        font-size: 0.8rem;
        margin: 0.1rem 0;
      }
      .finding-group .dismissal {
        margin: 0.1rem 0;
        font-size: 0.85rem;
      }
      .badge.dismissed {
        border-color: #777;
        background: #f0f0f0;
      }
      .badge.unconfirmed {
        border-color: #a60;
        font-style: italic;
      }
      .dismissal-note {
        font-style: italic;
        color: #444;
      }
      .dismiss-form {
        font-size: 0.85rem;
      }
      .suggested-actions {
        margin: 0.2rem 0 0.1rem 1.2rem;
        padding: 0;
        font-size: 0.85rem;
      }
    </style>
  </head>

    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
