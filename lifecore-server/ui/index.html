<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifeCore</title>
    <style>
      :root {
        font-size: 14px;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #1b1b1b;
      }
      code,
      pre {
        font-family: ui-monospace, monospace;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0 0 0.5rem;
      }
      h3 {
        font-size: 1rem;
        margin: 1rem 0 0.3rem;
      }
      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 15rem 1fr;
        min-height: 100vh;
      }
      header.top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.35rem 0.75rem;
        border-bottom: 1px solid #c8c8c8;
        background: #f4f4f4;
        flex-wrap: wrap;
      }
      header.top .spacer {
        flex: 1;
      }
      nav.side {
        border-right: 1px solid #c8c8c8;
        padding: 0.5rem 0.75rem;
        overflow: auto;
      }
      nav.side h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #666;
        margin: 0.75rem 0 0.25rem;
      }
      main {
        padding: 0.75rem 1rem;
        overflow: auto;
        min-width: 0;
      }
      main.full {
        grid-column: 1 / -1;
      }
      .types {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .types li {
        padding: 0.1rem 0.25rem;
        white-space: nowrap;
      }
      .types li.active {
        background: #e4ecf7;
      }
      .counts {
        color: #666;
        font-size: 0.85rem;
      }
      .db-id {
        display: inline-block;
        max-width: 8ch;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #c8c8c8;
        padding: 0.15rem 0.4rem;
        text-align: left;
        vertical-align: top;
        font-size: 0.9rem;
      }
      thead th {
        background: #f4f4f4;
        white-space: nowrap;
      }
      tr.historical td {
        color: #666;
        background: #fafafa;
      }
      .cell {
        max-width: 24rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .col-mandatory {
        font-weight: 700;
      }
      .col-deprecated {
        text-decoration: line-through;
      }
      .col-undeclared {
        font-style: italic;
        color: #a60;
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        color: #0645ad;
        text-decoration: underline;
        cursor: pointer;
        font: inherit;
      }
      button.sort {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pos {
        color: #555;
        font-size: 0.85em;
      }
      .muted {
        color: #666;
      }
      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        flex-wrap: wrap;
        margin: 0.3rem 0;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        line-height: 1.3;
        padding: 0 0.3rem;
        border-radius: 3px;
        border: 1px solid #999;
        background: #eee;
        vertical-align: middle;
        white-space: nowrap;
      }
      .badge.current {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .badge.historical {
        color: #666;
      }
      .badge.warn {
        border-color: #c80;
        background: #fff3dc;
      }
      .badge.asof {
        border-color: #06c;
        background: #e6f0ff;
        font-weight: 600;
      }
      .badge.status-mandatory {
        border-color: #333;
      }
      .badge.status-encouraged {
        border-color: #27a;
        background: #e8f2fb;
      }
      .badge.status-deprecated {
        border-color: #a33;
        background: #fbeaea;
      }
      .chips {
        display: flex;
        gap: 0.3rem;
        list-style: none;
        padding: 0;
        margin: 0.3rem 0;
        flex-wrap: wrap;
      }
      .chips li {
        border: 1px solid #aaa;
        border-radius: 1rem;
        padding: 0 0.5rem;
        background: #f4f4f4;
      }
      .chips li.muted {
        border: none;
        background: none;
      }
      fieldset {
        border: 1px solid #c8c8c8;
        margin: 0.4rem 0;
        padding: 0.3rem 0.6rem;
      }
      legend {
        font-size: 0.85rem;
        color: #666;
      }
      input[type="number"] {
        width: 3.5rem;
      }
      .toggle button {
        border: 1px solid #999;
        background: #f4f4f4;
        padding: 0.1rem 0.6rem;
        cursor: pointer;
      }
      .toggle button.on {
        background: #1b1b1b;
        color: #fff;
      }
      .lineage,
      .thread {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .lineage li,
      .thread li {
        padding: 0.15rem 0.4rem;
        border-left: 4px solid transparent;
      }
      .lineage li.current {
        font-weight: 600;
      }
      .lineage li.inspected {
        background: #eef;
      }
      .thread li.repeat,
      .thread li.cycle {
        color: #666;
      }
      .thread li.hl {
        background: #fff7c2;
      }
      .stripe-mark {
        display: inline-block;
        min-width: 0.9rem;
        font-size: 0.7rem;
        color: #666;
      }
      .stripe-0 {
        border-left-color: #e6194b;
      }
      .stripe-1 {
        border-left-color: #3cb44b;
      }
      .stripe-2 {
        border-left-color: #4363d8;
      }
      .stripe-3 {
        border-left-color: #f58231;
      }
      .stripe-4 {
        border-left-color: #911eb4;
      }
      .stripe-5 {
        border-left-color: #42d4f4;
      }
      .stripe-6 {
        border-left-color: #f032e6;
      }
      .stripe-7 {
        border-left-color: #9a6324;
      }
      .permissions {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 0.75rem;
        margin: 0.5rem 0;
      }
      .permissions dt {
        color: #666;
      }
      .permissions dd {
        margin: 0;
      }
      pre.raw {
        background: #f4f4f4;
        padding: 0.5rem;
        overflow: auto;
      }
      .error {
        border: 1px solid #b00020;
        background: #fff4f4;
        padding: 0.5rem 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
