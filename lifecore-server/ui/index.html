<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LifeCore</title>
    <style>
      :root {
        font-size: 14px;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #1b1b1b;
      }
      code,
      pre {
        font-family: ui-monospace, monospace;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0;
      }
      h2 {
        font-size: 1.15rem;
        margin: 0 0 0.5rem;
      }
      h3 {
        font-size: 1rem;
        margin: 1rem 0 0.3rem;
      }
      h4 {
        font-size: 0.85rem;
        color: #666;
        margin: 0.6rem 0 0.2rem;
      }
      /* The shell fills the viewport; the top bar and sidebar stay put and
         only the main pane and the sidebar scroll. minmax(0, 1fr) lets the
         row shrink below its content so overflow: auto takes effect. */
      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-columns: 15rem 1fr;
        height: 100vh;
      }
      header.top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.35rem 0.75rem;
        border-bottom: 1px solid #c8c8c8;
        background: #f4f4f4;
        flex-wrap: wrap;
      }
      header.top .spacer {
        flex: 1;
      }
      nav.side {
        border-right: 1px solid #c8c8c8;
        padding: 0.5rem 0.75rem;
        overflow: auto;
      }
      nav.side h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #666;
        margin: 0.75rem 0 0.25rem;
      }
      nav.side .hint {
        text-transform: none;
        font-weight: normal;
        font-style: italic;
      }
      main {
        padding: 0.75rem 1rem;
        overflow: auto;
        min-width: 0;
      }
      main.full {
        grid-column: 1 / -1;
      }
      .types {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .types li {
        padding: 0.1rem 0.25rem;
        white-space: nowrap;
      }
      .types li.active {
        background: #e4ecf7;
      }
      .counts {
        color: #666;
        font-size: 0.85rem;
      }
      .db-id {
        display: inline-block;
        max-width: 8ch;
        overflow: hidden;
        white-space: nowrap;
        vertical-align: bottom;
      }
      /* Separate borders: with collapsed ones Firefox drops the borders of a
         sticky header once it scrolls. Each cell draws its right and bottom
         edge, the first column its left edge, and the first row its top
         edge, so the grid still reads as continuous. */
      table {
        border-collapse: separate;
        border-spacing: 0;
      }
      th,
      td {
        border-right: 1px solid #c8c8c8;
        border-bottom: 1px solid #c8c8c8;
        padding: 0.15rem 0.4rem;
        text-align: left;
        vertical-align: top;
        font-size: 0.9rem;
      }
      th:first-child,
      td:first-child {
        border-left: 1px solid #c8c8c8;
      }
      thead th {
        border-top: 1px solid #c8c8c8;
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f4f4f4;
        white-space: nowrap;
      }
      tr.historical td {
        color: #666;
        background: #fafafa;
      }
      table > tbody:first-child > tr:first-child > th,
      table > tbody:first-child > tr:first-child > td {
        border-top: 1px solid #c8c8c8;
      }
      .cell {
        max-width: 24rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .col-mandatory {
        font-weight: 700;
      }
      .col-deprecated {
        text-decoration: line-through;
      }
      .col-undeclared {
        font-style: italic;
        color: #a60;
      }
      button.link {
        background: none;
        border: none;
        padding: 0;
        color: #0645ad;
        text-decoration: underline;
        cursor: pointer;
        font: inherit;
      }
      button.sort {
        background: none;
        border: none;
        padding: 0;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pos {
        color: #555;
        font-size: 0.85em;
      }
      .muted {
        color: #666;
      }
      .row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        flex-wrap: wrap;
        margin: 0.3rem 0;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        line-height: 1.3;
        padding: 0 0.3rem;
        border-radius: 3px;
        border: 1px solid #999;
        background: #eee;
        vertical-align: middle;
        white-space: nowrap;
      }
      .badge.current {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .badge.historical {
        color: #666;
      }
      .badge.warn {
        border-color: #c80;
        background: #fff3dc;
      }
      .badge.asof {
        border-color: #06c;
        background: #e6f0ff;
        font-weight: 600;
      }
      .badge.status-mandatory {
        border-color: #333;
      }
      .badge.status-encouraged {
        border-color: #27a;
        background: #e8f2fb;
      }
      .badge.status-deprecated {
        border-color: #a33;
        background: #fbeaea;
      }
      .chips {
        display: flex;
        gap: 0.3rem;
        list-style: none;
        padding: 0;
        margin: 0.3rem 0;
        flex-wrap: wrap;
      }
      .chips li {
        border: 1px solid #aaa;
        border-radius: 1rem;
        padding: 0 0.5rem;
        background: #f4f4f4;
      }
      .chips li.muted {
        border: none;
        background: none;
      }
      fieldset {
        border: 1px solid #c8c8c8;
        margin: 0.4rem 0;
        padding: 0.3rem 0.6rem;
      }
      legend {
        font-size: 0.85rem;
        color: #666;
      }
      .toggle button {
        border: 1px solid #999;
        background: #f4f4f4;
        padding: 0.1rem 0.6rem;
        cursor: pointer;
      }
      .toggle button.on {
        background: #1b1b1b;
        color: #fff;
      }
      .lineage,
      .thread {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .lineage li,
      .thread li {
        padding: 0.15rem 0.4rem;
        border-left: 4px solid transparent;
      }
      .lineage li.current {
        font-weight: 600;
      }
      .lineage li.inspected {
        background: #eef;
      }
      .thread li.repeat,
      .thread li.cycle {
        color: #666;
      }
      .thread li.hl {
        background: #fff7c2;
      }
      .stripe-mark {
        display: inline-block;
        min-width: 0.9rem;
        font-size: 0.7rem;
        color: #666;
      }
      .stripe-0 {
        border-left-color: #e6194b;
      }
      .stripe-1 {
        border-left-color: #3cb44b;
      }
      .stripe-2 {
        border-left-color: #4363d8;
      }
      .stripe-3 {
        border-left-color: #f58231;
      }
      .stripe-4 {
        border-left-color: #911eb4;
      }
      .stripe-5 {
        border-left-color: #42d4f4;
      }
      .stripe-6 {
        border-left-color: #f032e6;
      }
      .stripe-7 {
        border-left-color: #9a6324;
      }
      .permissions {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.2rem 0.75rem;
        margin: 0.5rem 0;
      }
      .permissions dt {
        color: #666;
      }
      .permissions dd {
        margin: 0;
      }
      pre.raw {
        background: #f4f4f4;
        padding: 0.5rem;
        overflow: auto;
      }
      .error {
        border: 1px solid #b00020;
        background: #fff4f4;
        padding: 0.5rem 1rem;
      }
      .error.compact {
        padding: 0.3rem 0.5rem;
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      .error.compact h2 {
        font-size: 0.9rem;
        text-transform: none;
        color: inherit;
        margin: 0 0 0.25rem;
      }
      .error.compact p {
        margin: 0;
      }
      /* editors */
      .editor .row > label {
        color: #666;
      }
      .editor input[aria-invalid="true"],
      .editor textarea[aria-invalid="true"] {
        border: 1px solid #b00020;
        background: #fff4f4;
      }
      .field-error {
        color: #b00020;
        font-size: 0.85rem;
      }
      .ref-chip {
        display: inline-block;
        border: 1px solid #aaa;
        border-radius: 1rem;
        padding: 0 0.5rem;
        background: #f4f4f4;
      }
      .intent {
        display: inline-flex;
        gap: 0.6rem;
        align-items: center;
        margin-left: 0.5rem;
      }
      .payload-editor .row h4 {
        margin: 0;
      }
      .fields-editor table.fields,
      .decls-editor table.fields {
        width: 100%;
      }
      table.fields td.value {
        width: 100%;
      }
      table.fields > tbody > tr.undeclared > th {
        font-style: italic;
        color: #a60;
      }
      table.fields > tbody > tr.group > th {
        background: #f4f4f4;
        color: #666;
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      /* Nested bodies indent under their field; their headers must not
         stick, or every level would pile up at the top while scrolling. */
      .fields-editor.nested,
      .decls-editor.nested {
        margin: 0.2rem 0 0.2rem 0.5rem;
        padding-left: 0.5rem;
        border-left: 2px solid #ddd;
      }
      .fields-editor.nested table.fields thead th,
      .decls-editor.nested table.fields thead th {
        position: static;
      }
      .list-editor .row {
        margin: 0.15rem 0;
      }
      .shape-builder {
        display: inline-flex;
        gap: 0.3rem;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .raw-editor textarea {
        font-family: ui-monospace, monospace;
        width: 100%;
        box-sizing: border-box;
      }
      .raw-editor {
        max-width: 60rem;
      }
      /* draft */
      /* A third column for the draft tray; main keeps minmax(0, 1fr) so it
         can shrink and scroll. */
      .app {
        grid-template-columns: 15rem minmax(0, 1fr) auto;
      }
      aside.tray {
        border-left: 1px solid #c8c8c8;
        background: #fbfbfb;
        width: 24rem;
        min-width: 0;
        overflow: auto;
        padding: 0.5rem 0.75rem;
        box-sizing: border-box;
      }
      aside.tray.collapsed {
        width: auto;
        padding: 0.5rem 0.3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      aside.tray.collapsed .strip {
        writing-mode: vertical-rl;
        color: #666;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      .tray-title {
        font-size: 0.8rem;
        text-transform: uppercase;
        color: #666;
        margin: 0.25rem 0;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .tray-spacer {
        flex: 1;
      }
      aside.tray h3 {
        font-size: 0.9rem;
        margin: 0.75rem 0 0.25rem;
      }
      .plan {
        font-size: 0.75rem;
        color: #666;
        overflow-wrap: anywhere;
        margin: 0.2rem 0;
      }
      .operations {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .operations li.op {
        border: 1px solid #ddd;
        border-radius: 3px;
        padding: 0.3rem 0.5rem;
        margin: 0.3rem 0;
        background: #fff;
      }
      .operations li.op.selected {
        border-color: #06c;
        background: #eef4ff;
      }
      .operations li.op.invalid {
        border-color: #b00020;
        background: #fff4f4;
      }
      .operations .row {
        margin: 0;
      }
      .badge.kind {
        text-transform: uppercase;
        font-size: 0.65rem;
      }
      .badge.kind-inconsistency,
      .badge.check-bad {
        border-color: #b00020;
        background: #fde8ea;
      }
      .badge.kind-warning,
      .badge.check-warn {
        border-color: #c80;
        background: #fff3dc;
      }
      .badge.kind-suggestion {
        border-color: #27a;
        background: #e8f2fb;
      }
      .badge.check-ok {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .ref-issue button.link {
        color: #a60;
        text-decoration: underline wavy;
      }
      .findings {
        list-style: none;
        margin: 0.2rem 0;
        padding: 0;
        font-size: 0.85rem;
      }
      .findings li {
        padding: 0.15rem 0;
        border-top: 1px dotted #ddd;
      }
      .findings .chips {
        margin: 0.15rem 0 0;
        font-size: 0.8rem;
      }
      .banner {
        border: 1px solid #999;
        background: #f4f4f4;
        padding: 0.4rem 0.6rem;
        margin: 0.4rem 0;
        font-size: 0.9rem;
        border-radius: 3px;
        overflow-wrap: anywhere;
      }
      .banner .note {
        margin: 0.3rem 0;
      }
      .banner ul {
        margin: 0.2rem 0 0.2rem 1rem;
        padding: 0;
      }
      .banner.asof {
        border-color: #06c;
        background: #e6f0ff;
      }
      .banner.stale,
      .banner.busy {
        border-color: #c80;
        background: #fff3dc;
      }
      .banner.uncertain,
      .banner.problem {
        border-color: #b00020;
        background: #fff4f4;
      }
      .banner.applied {
        border-color: #2a7;
        background: #e6f7ee;
      }
      .banner.picking {
        border-color: #27a;
        background: #e8f2fb;
      }
      aside.tray textarea.export {
        width: 100%;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      .importer textarea {
        width: 100%;
        max-width: 60rem;
        box-sizing: border-box;
        font-family: ui-monospace, monospace;
      }
      .reconnect-list {
        list-style: none;
        margin: 0.3rem 0;
        padding: 0;
      }
      .reconnect-list li {
        padding: 0.1rem 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
