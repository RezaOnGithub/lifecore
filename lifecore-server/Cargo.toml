[package]
name = "lifecore-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
lifecore-app = { path = "../lifecore-app" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
subtle = "2.6.1"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
lifecore = { path = "../" }
lifecore-dag-check = { path = "../lifecore-dag-check" }
lifecore-typecheck = { path = "../lifecore-typecheck" }
semver = "1.0"
tokio = { version = "1.53.3", features = ["io-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.24.0", features = ["v4"] }

[lints]
workspace = true
